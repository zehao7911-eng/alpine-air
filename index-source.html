<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101f32"><meta name="description" content="A pocket ski jumping tournament. Two taps, two jumps, three alpine hills."><title>Alpine Air</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game" aria-label="Alpine Air">
<div id="stage" aria-hidden="true"></div><div class="vignette"></div>
<header><div class="brand"><svg viewBox="0 0 40 32" aria-hidden="true"><path d="M2 28 15 7l6 10 5-8 12 19H2Z" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="m10 15 5 3 5-3m3 0 3 4 4-3" fill="none" stroke="currentColor" stroke-width="2.3"/></svg><span>ALPINE<br>AIR</span></div><div class="meet" id="meet"></div><button class="round" id="menu" aria-label="Open menu">Ⅱ</button></header>
<div id="hud" hidden><div><small id="jump"></small><strong id="meters">0 <sub>m</sub></strong></div><div class="wind"><small>CROSSWIND</small><b id="wind"></b></div></div>
<div id="toast" aria-live="polite"></div>
<section class="panel" id="panel" aria-live="polite"></section>
<div id="controls" hidden><div class="coach"><small id="step">01 / TAKEOFF</small><b id="hint">Watch the stripe.</b><div class="track"><div id="zone"></div><i id="needle"></i></div></div><button id="tap" aria-label="Take off"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m7 21 9-10 9 10M16 11v14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>JUMP</span></button></div>
<div class="rotate">↻<br><strong>Turn your phone upright</strong></div>
</main><script src="vendor/three.min.js"></script><script type="module" src="app.mjs"></script></body></html>
